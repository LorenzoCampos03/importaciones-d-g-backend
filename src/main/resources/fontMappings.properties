# Mapeo de fuentes para JasperReports
# Este archivo permite reemplazar fuentes no disponibles por fuentes estándar

# Reemplazar Berlin Sans FB por SansSerif
"Berlin Sans FB"=SansSerif
"Berlin Sans FB Demi"=SansSerif,Bold

# Asegurar que otras fuentes comunes estén mapeadas
Arial=SansSerif
"Arial Black"=SansSerif,Bold
Times=Serif
"Times New Roman"=Serif
